<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 912" width="680" height="912" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Project flow in 12 steps</title>
<desc id="d">A question leads into twelve numbered steps running top to bottom, from inventing an agency to the answer and MCP server, then what would happen on Float's real data. Steps 2 to 4 happen inside Float. Real Smart assign picks from step 3 are used again at step 8.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="912" fill="#FFFFFF"/>
<line x1="340" y1="68" x2="340" y2="84" stroke="#73726C" stroke-width="1.25" marker-end="url(#a)"/>
<line x1="340" y1="134" x2="340" y2="150" stroke="#73726C" stroke-width="1.25" marker-end="url(#a)"/>
<line x1="340" y1="200" x2="340" y2="216" stroke="#73726C" stroke-width="1.25" marker-end="url(#a)"/>
<line x1="340" y1="266" x2="340" y2="282" stroke="#73726C" stroke-width="1.25" marker-end="url(#a)"/>
<line x1="340" y1="332" x2="340" y2="348" stroke="#73726C" stroke-width="1.25" marker-end="url(#a)"/>
<line x1="340" y1="398" x2="340" y2="414" stroke="#73726C" stroke-width="1.25" marker-end="url(#a)"/>
<line x1="340" y1="464" x2="340" y2="480" stroke="#73726C" stroke-width="1.25" marker-end="url(#a)"/>
<line x1="340" y1="530" x2="340" y2="546" stroke="#73726C" stroke-width="1.25" marker-end="url(#a)"/>
<line x1="340" y1="596" x2="340" y2="612" stroke="#73726C" stroke-width="1.25" marker-end="url(#a)"/>
<line x1="340" y1="662" x2="340" y2="678" stroke="#73726C" stroke-width="1.25" marker-end="url(#a)"/>
<line x1="340" y1="728" x2="340" y2="744" stroke="#73726C" stroke-width="1.25" marker-end="url(#a)"/>
<line x1="340" y1="794" x2="340" y2="810" stroke="#73726C" stroke-width="1.25" marker-end="url(#a)" stroke-dasharray="4 3"/>
<path d="M510 242 L556 242 L556 572 L512 572" fill="none" stroke="#73726C" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="566" y="403" font-size="12" fill="#5F5E5A">Real picks</text><text x="566" y="419" font-size="12" fill="#5F5E5A">used again</text>
<rect x="170" y="20" width="340" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="340" y="40" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">The question</text><text x="340" y="58" text-anchor="middle" font-size="12" fill="#534AB7">Is past work worth adding to Smart assign?</text>
<rect x="170" y="86" width="340" height="48" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.75"/><text x="340" y="106" text-anchor="middle" font-size="14" font-weight="600" fill="#1B1B1A">1. Invent an agency</text><text x="340" y="124" text-anchor="middle" font-size="12" fill="#5F5E5A">54 people, 18 months of staffing</text>
<rect x="170" y="152" width="340" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/><text x="340" y="172" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">2. Load it into Float</text><text x="340" y="190" text-anchor="middle" font-size="12" fill="#0F6E56">Public API, rate limited, resumable</text>
<rect x="170" y="218" width="340" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/><text x="340" y="238" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">3. Record Smart assign's picks</text><text x="340" y="256" text-anchor="middle" font-size="12" fill="#0F6E56">From the app, 20 open roles</text>
<rect x="170" y="284" width="340" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/><text x="340" y="304" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">4. Pull the data back</text><text x="340" y="322" text-anchor="middle" font-size="12" fill="#0F6E56">Read-only, through the API</text>
<rect x="170" y="350" width="340" height="48" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.75"/><text x="340" y="370" text-anchor="middle" font-size="14" font-weight="600" fill="#1B1B1A">5. Build signals, check them in dbt</text><text x="340" y="388" text-anchor="middle" font-size="12" fill="#5F5E5A">Known at the time only, dbt on DuckDB</text>
<rect x="170" y="416" width="340" height="48" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.75"/><text x="340" y="436" text-anchor="middle" font-size="14" font-weight="600" fill="#1B1B1A">6. Replay each decision</text><text x="340" y="454" text-anchor="middle" font-size="12" fill="#5F5E5A">Hide who got the job</text>
<rect x="170" y="482" width="340" height="48" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.75"/><text x="340" y="502" text-anchor="middle" font-size="14" font-weight="600" fill="#1B1B1A">7. Rank with both models</text><text x="340" y="520" text-anchor="middle" font-size="12" fill="#5F5E5A">Reconstruction vs conditional logit</text>
<rect x="170" y="548" width="340" height="48" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.75"/><text x="340" y="568" text-anchor="middle" font-size="14" font-weight="600" fill="#1B1B1A">8. Score on later decisions</text><text x="340" y="586" text-anchor="middle" font-size="12" fill="#5F5E5A">Trained on earlier ones</text>
<rect x="170" y="614" width="340" height="48" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.75"/><text x="340" y="634" text-anchor="middle" font-size="14" font-weight="600" fill="#1B1B1A">9. Repeat on bigger agencies</text><text x="340" y="652" text-anchor="middle" font-size="12" fill="#5F5E5A">Offline, plus a control run</text>
<rect x="170" y="680" width="340" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="340" y="700" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">10. Audit and checks</text><text x="340" y="718" text-anchor="middle" font-size="12" fill="#534AB7">Each check is a test in the repo</text>
<rect x="170" y="746" width="340" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="340" y="766" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">11. Answer and MCP server</text><text x="340" y="784" text-anchor="middle" font-size="12" fill="#534AB7">Small lift at big firms, not small</text>
<rect x="170" y="812" width="340" height="48" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="4 3"/><text x="340" y="832" text-anchor="middle" font-size="14" font-weight="600" fill="#1B1B1A">12. Next, on Float's real data</text><text x="340" y="850" text-anchor="middle" font-size="12" fill="#5F5E5A">Change history, then shadow mode</text>
<rect x="150" y="878" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/><text x="170" y="889" font-size="12" fill="#5F5E5A">Inside Float</text><rect x="270" y="878" width="14" height="14" rx="3" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.75"/><text x="290" y="889" font-size="12" fill="#5F5E5A">My code</text><rect x="360" y="878" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="380" y="889" font-size="12" fill="#5F5E5A">Question, proof, answer</text>
</svg>
